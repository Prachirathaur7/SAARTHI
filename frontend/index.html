const API_URL="https://saarthi-p5f0.onrender.com"; // your deployed backend (no trailing slash)
const KEYMAP={"Guaranteed/unrealistic return":"guar","OTP/PIN request":"cred","Third-party payment":"pay","Suspicious link":"apk","Urgency":"urg"};
async function callApi(text){
 if(text.trim().length<5)return{lvl:"INSUFF",sigs:[],sens:false};
 const slow=setTimeout(()=>{const c=document.querySelector("#out .card");if(c)c.insertAdjacentHTML("beforeend","<p class='mut fine'>Waking up the server... the first check can take up to a minute.</p>")},5000);
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),70000);
 try{
  const r=await fetch(API_URL+"/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text}),signal:ctl.signal});
  if(r.status===422)throw new Error("INVALID");
  if(!r.ok)throw new Error("SERVER");
  const d=await r.json();
  const sigs=(d.reasons||[]).map(n=>KEYMAP[n]).filter(Boolean).map(k=>RULES.find(x=>x.k===k));
  let lvl=d.risk==="HIGH"?(d.risk_score>=80?"CRITICAL":"HIGH"):d.risk==="VERIFY"?"CAUTION":"SAFE";
  if(lvl==="SAFE"&&text.trim().length<25&&!sigs.length)lvl="INSUFF";
  return{lvl,sigs,score:d.risk_score,conf:d.confidence,sens:/\botp\b|\bpin\b|password|cvv/i.test(text)&&/\b\d{4,6}\b/.test(text)};
 }finally{clearTimeout(slow);clearTimeout(to)}
}

 const ic=I({SAFE:"check",CAUTION:"info",HIGH:"alert",CRITICAL:"stop"}[a.lvl],22),n={SAFE:1,CAUTION:2,HIGH:3,CRITICAL:4}[a.lvl];

 const tip=TIP[a.sigs.length?a.sigs[0].k:"none"];

 $("#out").innerHTML=`${a.sens?`<div class="warn">${L.sens}</div>`:""}<h2>Safety Analysis</h2><div class="card"><span class="badge big ${a.lvl}">${ic} ${L.lvl[a.lvl]}</span><div class="meter ${a.lvl}" role="img" aria-label="Level ${n} of 4">${[1,2,3,4].map(k=>`<i class="${k<=n?"on":""}"></i>`).join("")}</div><div class="mlab" aria-hidden="true"><span>Safe</span><span>Caution</span><span>High</span><span>Critical</span></div><p>${summary}</p>${a.score!=null?`<p class="mut fine">Prototype risk indicator: ${a.score}/100${a.conf!=null?" \u00b7 Model confidence: "+Math.round(a.conf*100)+"%":""}. Not proof of fraud.</p>`:""}<button class="btn" id="sp">${I("speaker",18)} Listen</button></div>

 $("#sp").onclick=()=>speak(summary);$("#gg").onclick=()=>go("rights");$("#out").scrollIntoView({behavior:"smooth"})}).catch(e=>{$("#out").innerHTML=`<div class="card warn">${e.message==="INVALID"?"Please enter between 5 and 5000 characters.":"Could not reach the analysis server. Please check your internet connection and try again in a minute."}</div>`})}
